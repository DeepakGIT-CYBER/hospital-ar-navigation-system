<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="style.css">

<style>

body{

background:linear-gradient(135deg,#0066cc,#00b4db);

display:flex;

justify-content:center;

align-items:center;

height:100vh;

font-family:Poppins,sans-serif;

}

.login-box{

width:420px;

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 15px 30px rgba(0,0,0,.25);

}

.login-box h1{

text-align:center;

color:#0066cc;

margin-bottom:30px;

}

input{

width:100%;

padding:15px;

margin:15px 0;

border:1px solid #ccc;

border-radius:10px;

font-size:16px;

}

button{

width:100%;

padding:15px;

background:#0066cc;

color:white;

border:none;

font-size:18px;

border-radius:10px;

cursor:pointer;

margin-top:20px;

}

button:hover{

background:#004999;

}

p{

text-align:center;

margin-top:20px;

}

</style>

</head>

<body>

<div class="login-box">

<h1>

🏥 Hospital Login

</h1>

<input type="text" id="user" placeholder="Username">

<input type="password" id="pass" placeholder="Password">

<button onclick="login()">

Login

</button>

<p>

Demo Login

Username : admin

Password : admin123

</p>

</div>

<script>

function login(){

let u=document.getElementById("user").value;

let p=document.getElementById("pass").value;

if(u=="admin" && p=="admin123"){

alert("Login Successful");

location.href="dashboard.html";

}

else{

alert("Invalid Username or Password");

}

}

</script>

</body>

</html>
