<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Hospital Navigation</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#edf4ff;
}

header{
background:#0066cc;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.top{
display:flex;
justify-content:space-around;
background:white;
padding:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
font-size:20px;
font-weight:bold;
}

#map{

width:1100px;
height:650px;

background:#f8f8f8;

margin:30px auto;

position:relative;

border-radius:20px;

overflow:hidden;

box-shadow:0 15px 30px rgba(0,0,0,.2);

}

.room{

position:absolute;

width:160px;

height:90px;

background:#0d6efd;

color:white;

display:flex;

justify-content:center;

align-items:center;

font-size:18px;

font-weight:bold;

border-radius:15px;

}

#reception{left:20px;top:20px;}
#emergency{left:250px;top:20px;}
#cardiology{left:480px;top:20px;}
#neurology{left:710px;top:20px;}

#icu{left:20px;top:220px;}
#pharmacy{left:250px;top:220px;}
#radiology{left:480px;top:220px;}
#laboratory{left:710px;top:220px;}

#orthopedics{left:20px;top:430px;}
#blood{left:250px;top:430px;}
#operation{left:480px;top:430px;}
#canteen{left:710px;top:430px;}

#route{

position:absolute;

left:95px;

top:610px;

width:6px;

height:0;

background:#00cc44;

transition:4s;

}

#marker{

width:35px;

height:35px;

background:red;

border-radius:50%;

position:absolute;

left:80px;

top:600px;

transition:4s linear;

box-shadow:0 0 20px red;

z-index:999;

}

#you{

position:absolute;

left:40px;

top:585px;

font-size:18px;

font-weight:bold;

color:#0066cc;

}

.panel{

display:flex;

justify-content:center;

gap:30px;

margin:20px;

}

.box{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.2);

width:250px;

text-align:center;

font-size:20px;

}

button{

padding:15px 35px;

background:#0066cc;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

margin:20px;

}

button:hover{

background:#004999;

}

</style>

</head>

<body>

<header>

🏥 Advanced Hospital Navigation

</header>

<div class="top">

<div>
Current : Reception
</div>

<div id="dest">
Destination
</div>

<div id="distance">
Distance : 20 m
</div>

</div>

<div id="map">

<div class="room" id="reception">Reception</div>
<div class="room" id="emergency">Emergency</div>
<div class="room" id="cardiology">Cardiology</div>
<div class="room" id="neurology">Neurology</div>

<div class="room" id="icu">ICU</div>
<div class="room" id="pharmacy">Pharmacy</div>
<div class="room" id="radiology">Radiology</div>
<div class="room" id="laboratory">Laboratory</div>

<div class="room" id="orthopedics">Orthopedics</div>
<div class="room" id="blood">Blood Bank</div>
<div class="room" id="operation">Operation Theatre</div>
<div class="room" id="canteen">Cafeteria</div>

<div id="route"></div>

<div id="marker"></div>

<div id="you">

YOU

</div>

</div>

<center>

<button onclick="navigate()">

START NAVIGATION

</button>

<button onclick="location.href='camera.html'">

OPEN AR CAMERA

</button>

</center>

<script>

let destination=localStorage.getItem("destination")||"Emergency";

document.getElementById("dest").innerHTML="Destination : "+destination;

let marker=document.getElementById("marker");

let route=document.getElementById("route");

function speak(text){

let msg=new SpeechSynthesisUtterance(text);

speechSynthesis.speak(msg);

}

function navigate(){
    destination = destination.trim();

switch(destination){

case "Emergency":

marker.style.left="320px";
marker.style.top="55px";
route.style.height="560px";
break;

case "Cardiology":

marker.style.left="550px";
marker.style.top="55px";
route.style.height="560px";
break;

case "Neurology":

marker.style.left="780px";
marker.style.top="55px";
route.style.height="560px";
break;

case "ICU":

marker.style.left="90px";
marker.style.top="255px";
route.style.height="360px";
break;

case "Pharmacy":

marker.style.left="320px";
marker.style.top="255px";
route.style.height="360px";
break;

case "Radiology":

marker.style.left="550px";
marker.style.top="255px";
route.style.height="360px";
break;

case "Laboratory":

marker.style.left="780px";
marker.style.top="255px";
route.style.height="360px";
break;

case "Orthopedics":

marker.style.left="90px";
marker.style.top="465px";
route.style.height="150px";
break;

case "Blood Bank":

marker.style.left="320px";
marker.style.top="465px";
route.style.height="150px";
break;

case "Operation Theatre":

marker.style.left="550px";
marker.style.top="465px";
route.style.height="150px";
break;

case "Cafeteria":

marker.style.left="780px";
marker.style.top="465px";
route.style.height="150px";
break;

}

speak("Navigation started. Proceed towards "+destination);

let d=20;

let timer=setInterval(function(){

d--;

document.getElementById("distance").innerHTML="Distance : "+d+" m";

if(d<=0){

clearInterval(timer);

document.getElementById("distance").innerHTML="Destination Reached";

speak("You have reached your destination");

}

},250);

}

</script>

</body>

</html>
